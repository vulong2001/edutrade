<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Đăng ký tư vấn - Edu Trade</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-gradient-start: #0f0c29;
            --bg-gradient-mid: #302b63;
            --bg-gradient-end: #24243e;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --accent: #667eea;
            --accent-light: #764ba2;
            --error: #fc8181;
            --success: #68d391;
            --input-bg: rgba(255, 255, 255, 0.08);
            --input-border: rgba(255, 255, 255, 0.15);
            --input-focus: #667eea;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-mid), var(--bg-gradient-end));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container { width: 100%; max-width: 480px; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        }

        .logo { text-align: center; margin-bottom: 8px; }

        .logo-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            margin-bottom: 16px;
        }

        .header { text-align: center; margin-bottom: 32px; }
        .header h1 { color: var(--text-primary); font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .header p { color: var(--text-secondary); font-size: 15px; }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; color: var(--text-secondary); font-size: 13px; font-weight: 500; margin-bottom: 8px; }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
        }

        .form-input:focus { border-color: var(--input-focus); }
        .form-input.is-invalid { border-color: var(--error); }

        .error-message { color: var(--error); font-size: 12px; margin-top: 6px; }

        /* CHECKBOX ĐƠN GIẢN - KHÔNG ẨN */
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .checkbox-label {
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            flex: 1;
        }

        .checkbox-label a { color: var(--accent); text-decoration: none; }

        /* Hiển thị giá trị checkbox */
        .checkbox-value {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .checkbox-value.true {
            background: rgba(104, 211, 145, 0.2);
            color: #68d391;
        }

        .checkbox-value.false {
            background: rgba(252, 129, 129, 0.2);
            color: #fc8181;
        }

        .btn-submit {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .success-message {
            background: rgba(104, 211, 145, 0.15);
            border: 1px solid rgba(104, 211, 145, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            color: var(--success);
            font-size: 14px;
        }

        .footer { text-align: center; margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--card-border); }
        .footer p { color: var(--text-secondary); font-size: 14px; }
        .footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="logo">
            <div class="logo-icon">📈</div>
        </div>

        <div class="header">
            <h1>Đăng ký tư vấn</h1>
            <p>Điền thông tin để nhận tư vấn miễn phí từ Edu Trade</p>
        </div>

        <!-- Success Message -->
        <div th:if="${successMessage}" class="success-message">
            ✓ <span th:text="${successMessage}">Đăng ký thành công!</span>
        </div>

        <!-- Form -->
        <form th:action="@{/edutrade/api/register-consultation}" th:object="${consultationForm}" method="post" id="registerForm">

            <!-- Họ và tên -->
            <div class="form-group">
                <label class="form-label">Họ và tên *</label>
                <input type="text" th:field="*{name}" class="form-input"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                       placeholder="Nguyễn Văn A" required/>
                <div th:if="${#fields.hasErrors('name')}" class="error-message" th:errors="*{name}">Lỗi</div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label class="form-label">Email *</label>
                <input type="email" th:field="*{email}" class="form-input"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                       placeholder="you@example.com" required/>
                <div th:if="${#fields.hasErrors('email')}" class="error-message" th:errors="*{email}">Lỗi</div>
            </div>

            <!-- Số điện thoại -->
            <div class="form-group">
                <label class="form-label">Số điện thoại *</label>
                <input type="tel" th:field="*{phone}" class="form-input"
                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                       placeholder="0901234567" required/>
                <div th:if="${#fields.hasErrors('phone')}" class="error-message" th:errors="*{phone}">Lỗi</div>
            </div>

            <!-- Checkbox - ĐƠN GIẢN, KHÔNG CUSTOM -->
            <div class="checkbox-wrapper">
                <input type="checkbox"
                       id="flagProvision"
                       th:field="*{flagProvision}"/>
                <label class="checkbox-label" for="flagProvision">
                    Tôi đồng ý với <a href="#">Điều khoản</a> và <a href="#">Chính sách bảo mật</a>
                </label>
            </div>
            <div th:if="${#fields.hasErrors('flagProvision')}" class="error-message" style="margin-top: -16px; margin-bottom: 16px;">
                ⚠ <span th:errors="*{flagProvision}">Vui lòng đồng ý điều khoản</span>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit" id="submitBtn">
                Đăng Ký Nhận Tư Vấn
            </button>
        </form>

        <div class="footer">
            <p>Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
        </div>
    </div>
</div>

<script>
    const checkbox = document.getElementById('flagProvision');
    const valueDisplay = document.getElementById('checkboxValue');
    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');

    // Cập nhật hiển thị value
    function updateCheckboxDisplay() {
        const isChecked = checkbox.checked;
        valueDisplay.textContent = isChecked ? 'true' : 'false';
        valueDisplay.className = 'checkbox-value ' + (isChecked ? 'true' : 'false');
        console.log('Checkbox value:', isChecked);
    }

    // Lắng nghe sự kiện change
    checkbox.addEventListener('change', updateCheckboxDisplay);

    // Lắng nghe click (backup)
    checkbox.addEventListener('click', function() {
        setTimeout(updateCheckboxDisplay, 10);
    });

    // Khởi tạo ban đầu
    updateCheckboxDisplay();

    // Submit form
    form.addEventListener('submit', function(e) {
        console.log('Form submitting...');
        console.log('Name:', document.querySelector('[name="name"]').value);
        console.log('Email:', document.querySelector('[name="email"]').value);
        console.log('Phone:', document.querySelector('[name="phone"]').value);
        console.log('flagProvision:', checkbox.checked);

        // Kiểm tra checkbox
        if (!checkbox.checked) {
            e.preventDefault();
            alert('Vui lòng đồng ý điều khoản để tiếp tục!');
            return false;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Đang xử lý...';
    });
</script>
</body>
</html>
